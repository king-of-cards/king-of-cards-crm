spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/koc_identity_dev
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
identity:
  refresh:
    token-ttl: ${IDENTITY_REFRESH_TOKEN_TTL:7d}
  cookie:
    secure: ${IDENTITY_COOKIE_SECURE:false}
    same-site: ${IDENTITY_COOKIE_SAME_SITE:Lax}
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}